<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem 1rem; }
    .container { max-width: 860px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* Auth Pages */
    .auth-container { max-width: 400px; margin: 4rem auto; }
    .auth-card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 2rem; }
    .auth-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    .auth-subtitle { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; font-family: inherit; outline: none; }
    input:focus { border-color: #1a1a1a; }
    .btn { width: 100%; padding: 10px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 4px; }
    .btn:hover { background: #333; }
    .btn-outline { width: 100%; padding: 10px; background: #fff; color: #1a1a1a; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; }
    .btn-outline:hover { background: #f5f5f0; }
    .auth-switch { text-align: center; margin-top: 1rem; font-size: 13px; color: #888; }
    .auth-switch a { color: #1a1a1a; cursor: pointer; font-weight: 600; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }
    .error { color: #A32D2D; font-size: 13px; margin-bottom: 10px; background: #FCEBEB; padding: 8px 12px; border-radius: 8px; }
    .success { color: #0F6E56; font-size: 13px; margin-bottom: 10px; background: #E1F5EE; padding: 8px 12px; border-radius: 8px; }

    /* Main App */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header-left h1 { font-size: 24px; font-weight: 600; }
    .header-left p { font-size: 13px; color: #888; margin-top: 2px; }
    .btn-logout { padding: 7px 16px; background: #fff; color: #A32D2D; border: 1px solid #f0c0c0; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .btn-logout:hover { background: #FCEBEB; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 10px; padding: 1rem; border: 0.5px solid #e0e0e0; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media(max-width:600px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 0.5px solid #e0e0e0; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .btn-add { width: 100%; padding: 9px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 4px; }
    .btn-add:hover { background: #333; }
    .btn-cancel { width: 100%; padding: 9px; background: #fff; color: #1a1a1a; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 6px; }
    .expense-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #f0f0f0; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .exp-desc { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .exp-date { font-size: 12px; color: #aaa; white-space: nowrap; }
    .exp-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .action-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 2px 4px; }
    .action-btn:hover { opacity: 0.6; }
    .empty { font-size: 14px; color: #aaa; text-align: center; padding: 1.5rem 0; }
    .summary-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .bar-wrap { height: 6px; background: #f0f0f0; border-radius: 3px; margin-top: 4px; }
    .bar { height: 6px; border-radius: 3px; transition: width 0.4s; }
    .total-row { display: flex; justify-content: space-between; border-top: 1px solid #eee; padding-top: 10px; font-weight: 600; font-size: 14px; margin-top: 8px; }
    .editing { background: #fffbe6; border: 1px solid #EF9F27 !important; }
    .form-mode-label { font-size: 13px; color: #854F0B; background: #FAEEDA; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page" class="auth-container">
  <div class="auth-card">
    <div style="font-size:32px;margin-bottom:12px">💸</div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-subtitle">Sign in to your Expense Tracker</div>
    <div id="login-error" class="error hidden"></div>
    <div class="form-group"><label>Email</label><input id="login-email" type="email" placeholder="you@email.com"/></div>
    <div class="form-group"><label>Password</label><input id="login-password" type="password" placeholder="••••••••"/></div>
    <button class="btn" onclick="login()">Sign In</button>
    <div class="auth-switch">Don't have an account? <a onclick="showSignup()">Sign up</a></div>
  </div>
</div>

<!-- SIGNUP PAGE -->
<div id="signup-page" class="auth-container hidden">
  <div class="auth-card">
    <div style="font-size:32px;margin-bottom:12px">💸</div>
    <div class="auth-title">Create account</div>
    <div class="auth-subtitle">Start tracking your expenses</div>
    <div id="signup-error" class="error hidden"></div>
    <div id="signup-success" class="success hidden"></div>
    <div class="form-group"><label>Email</label><input id="signup-email" type="email" placeholder="you@email.com"/></div>
    <div class="form-group"><label>Password</label><input id="signup-password" type="password" placeholder="min 6 characters"/></div>
    <div class="form-group"><label>Confirm Password</label><input id="signup-confirm" type="password" placeholder="repeat password"/></div>
    <button class="btn" onclick="signup()">Create Account</button>
    <div class="auth-switch">Already have an account? <a onclick="showLogin()">Sign in</a></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" class="container hidden">
  <div class="header">
    <div class="header-left">
      <h1>💸 Expense Tracker</h1>
      <p id="user-email"></p>
    </div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total Spent</div><div class="stat-value" id="stat-total">Rs 0.00</div></div>
    <div class="stat"><div class="stat-label">Expenses</div><div class="stat-value" id="stat-count">0</div></div>
    <div class="stat"><div class="stat-label">Categories</div><div class="stat-value" id="stat-cats">0</div></div>
    <div class="stat"><div class="stat-label">Top Category</div><div class="stat-value" style="color:#1D9E75" id="stat-top">—</div></div>
  </div>

  <div class="grid">
    <div class="card" id="form-card">
      <div class="card-title" id="form-title">Add Expense</div>
      <div id="edit-badge" style="display:none"><span class="form-mode-label">✏️ Editing expense</span></div>
      <p class="error" id="expense-error" style="display:none"></p>
      <div class="form-group"><label>Description</label><input id="inp-desc" placeholder="e.g. Lunch at Café"/></div>
      <div class="form-group"><label>Amount (Rs)</label><input id="inp-amount" type="number" placeholder="0.00" min="0" step="0.01"/></div>
      <div class="form-group">
        <label>Category</label>
        <select id="inp-cat">
          <option>Food</option><option>Transport</option><option>Shopping</option>
          <option>Bills</option><option>Health</option><option>Entertainment</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Date</label><input id="inp-date" type="date"/></div>
      <button class="btn-add" id="submit-btn" onclick="submitForm()">+ Add Expense</button>
      <button class="btn-cancel" id="cancel-btn" style="display:none" onclick="cancelEdit()">Cancel</button>
    </div>

    <div class="card">
      <div class="card-title">Category Summary</div>
      <div id="summary"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">All Expenses</div>
    <div id="expense-list"></div>
  </div>
</div>

<script>
  const API = 'https://backend-production-0b67.up.railway.app/api';
  const CAT = {
    Food:{bg:'#E1F5EE',text:'#0F6E56'},
    Transport:{bg:'#E6F1FB',text:'#185FA5'},
    Shopping:{bg:'#FBEAF0',text:'#993556'},
    Bills:{bg:'#FAEEDA',text:'#854F0B'},
    Health:{bg:'#EEEDFE',text:'#534AB7'},
    Entertainment:{bg:'#FAECE7',text:'#993C1D'},
    Other:{bg:'#F1EFE8',text:'#5F5E5A'}
  };

  let expenses = [];
  let editingId = null;
  let token = localStorage.getItem('token');
  let userEmail = localStorage.getItem('userEmail');

  // ---------- Page Navigation ----------
  function showLogin() {
    document.getElementById('login-page').classList.remove('hidden');
    document.getElementById('signup-page').classList.add('hidden');
    document.getElementById('main-app').classList.add('hidden');
  }

  function showSignup() {
    document.getElementById('signup-page').classList.remove('hidden');
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('main-app').classList.add('hidden');
  }

  function showApp() {
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('signup-page').classList.add('hidden');
    document.getElementById('user-email').textContent = userEmail;
    document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];
    fetchExpenses();
  }

  // ---------- Auth ----------
  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');

    if (!email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.remove('hidden');
      return;
    }

    try {
      const res = await fetch(API + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.detail || 'Login failed.';
        errEl.classList.remove('hidden');
        return;
      }
      token = data.access_token;
      userEmail = data.email;
      localStorage.setItem('token', token);
      localStorage.setItem('userEmail', userEmail);
      errEl.classList.add('hidden');
      showApp();
    } catch {
      errEl.textContent = 'Could not connect to server.';
      errEl.classList.remove('hidden');
    }
  }

  async function signup() {
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const errEl = document.getElementById('signup-error');
    const sucEl = document.getElementById('signup-success');

    if (!email || !password || !confirm) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.remove('hidden');
      return;
    }
    if (password.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.classList.remove('hidden');
      return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match.';
      errEl.classList.remove('hidden');
      return;
    }

    try {
      const res = await fetch(API + '/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.detail || 'Signup failed.';
        errEl.classList.remove('hidden');
        sucEl.classList.add('hidden');
        return;
      }
      token = data.access_token;
      userEmail = data.email;
      localStorage.setItem('token', token);
      localStorage.setItem('userEmail', userEmail);
      errEl.classList.add('hidden');
      showApp();
    } catch {
      errEl.textContent = 'Could not connect to server.';
      errEl.classList.remove('hidden');
    }
  }

  function logout() {
    token = null;
    userEmail = null;
    expenses = [];
    localStorage.removeItem('token');
    localStorage.removeItem('userEmail');
    showLogin();
  }

  // ---------- Expenses ----------
  async function fetchExpenses() {
    try {
      const res = await fetch(API + '/expenses', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { logout(); return; }
      expenses = await res.json();
      render();
    } catch {
      console.log('Could not fetch expenses');
    }
  }

  function submitForm() {
    if (editingId !== null) updateExpense();
    else addExpense();
  }

  async function addExpense() {
    const desc = document.getElementById('inp-desc').value.trim();
    const amount = parseFloat(document.getElementById('inp-amount').value);
    const category = document.getElementById('inp-cat').value;
    const date = document.getElementById('inp-date').value;
    const errEl = document.getElementById('expense-error');

    if (!desc || !amount || !date) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    try {
      const res = await fetch(API + '/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ description: desc, amount, category, date })
      });
      if (res.status === 401) { logout(); return; }
      const newExp = await res.json();
      expenses.push(newExp);
      document.getElementById('inp-desc').value = '';
      document.getElementById('inp-amount').value = '';
      render();
    } catch {
      errEl.textContent = 'Could not connect to server.';
      errEl.style.display = 'block';
    }
  }

  async function updateExpense() {
    const desc = document.getElementById('inp-desc').value.trim();
    const amount = parseFloat(document.getElementById('inp-amount').value);
    const category = document.getElementById('inp-cat').value;
    const date = document.getElementById('inp-date').value;
    const errEl = document.getElementById('expense-error');

    if (!desc || !amount || !date) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    try {
      const res = await fetch(API + '/expenses/' + editingId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ description: desc, amount, category, date })
      });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      const idx = expenses.findIndex(e => e.id === editingId);
      if (idx !== -1) expenses[idx] = data.expense;
      cancelEdit();
      render();
    } catch {
      errEl.textContent = 'Update failed.';
      errEl.style.display = 'block';
    }
  }

  function startEdit(id) {
    const expense = expenses.find(e => e.id === id);
    if (!expense) return;
    editingId = id;
    document.getElementById('inp-desc').value = expense.description;
    document.getElementById('inp-amount').value = expense.amount;
    document.getElementById('inp-cat').value = expense.category;
    document.getElementById('inp-date').value = expense.date;
    document.getElementById('form-title').textContent = 'Edit Expense';
    document.getElementById('submit-btn').textContent = '✓ Save Changes';
    document.getElementById('cancel-btn').style.display = 'block';
    document.getElementById('edit-badge').style.display = 'block';
    document.getElementById('form-card').classList.add('editing');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-amount').value = '';
    document.getElementById('inp-cat').value = 'Food';
    document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('form-title').textContent = 'Add Expense';
    document.getElementById('submit-btn').textContent = '+ Add Expense';
    document.getElementById('cancel-btn').style.display = 'none';
    document.getElementById('edit-badge').style.display = 'none';
    document.getElementById('form-card').classList.remove('editing');
  }

  async function deleteExpense(id) {
    try {
      await fetch(API + '/expenses/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      expenses = expenses.filter(e => e.id !== id);
      if (editingId === id) cancelEdit();
      render();
    } catch {
      alert('Delete failed.');
    }
  }

  // ---------- Render ----------
  function render() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const summary = {};
    expenses.forEach(e => { summary[e.category] = (summary[e.category] || 0) + e.amount; });
    const topCat = Object.entries(summary).sort((a, b) => b[1] - a[1])[0];
    const maxVal = Math.max(...Object.values(summary), 1);

    document.getElementById('stat-total').textContent = 'Rs ' + total.toFixed(2);
    document.getElementById('stat-count').textContent = expenses.length;
    document.getElementById('stat-cats').textContent = Object.keys(summary).length;
    document.getElementById('stat-top').textContent = topCat ? topCat[0] : '—';

    const listEl = document.getElementById('expense-list');
    if (!expenses.length) {
      listEl.innerHTML = '<p class="empty">No expenses yet. Add one above!</p>';
    } else {
      listEl.innerHTML = [...expenses].reverse().map(e => `
        <div class="expense-item">
          <span class="badge" style="background:${CAT[e.category]?.bg||'#F1EFE8'};color:${CAT[e.category]?.text||'#5F5E5A'}">${e.category}</span>
          <span class="exp-desc">${e.description}</span>
          <span class="exp-date">${e.date}</span>
          <span class="exp-amt">Rs ${(+e.amount).toFixed(2)}</span>
          <button class="action-btn" onclick="startEdit(${e.id})">✏️</button>
          <button class="action-btn" onclick="deleteExpense(${e.id})">🗑</button>
        </div>`).join('');
    }

    const sumEl = document.getElementById('summary');
    if (!Object.keys(summary).length) {
      sumEl.innerHTML = '<p class="empty">No data yet</p>';
    } else {
      sumEl.innerHTML = Object.entries(summary).sort((a,b)=>b[1]-a[1]).map(([cat,amt]) => `
        <div class="summary-row">
          <div style="flex:1">
            <div style="font-size:13px">${cat}</div>
            <div class="bar-wrap"><div class="bar" style="width:${(amt/maxVal*100).toFixed(1)}%;background:${CAT[cat]?.text||'#888'}"></div></div>
          </div>
          <span style="font-size:13px;font-weight:600;white-space:nowrap">Rs ${amt.toFixed(2)}</span>
        </div>`).join('') +
        `<div class="total-row"><span>Total</span><span>Rs ${total.toFixed(2)}</span></div>`;
    }
  }

  // ---------- Init ----------
  if (token) {
    showApp();
  } else {
    showLogin();
  }
</script>
</body>
</html>
